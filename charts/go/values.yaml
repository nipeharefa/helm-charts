# Default values for go.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: nginx
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # Enable or disable the Service resource
  enabled: true
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80
  # Multiple ports configuration (optional, takes precedence over 'port' if specified)
  # ports:
  #   - name: http
  #     port: 80
  #     targetPort: 8080
  #     protocol: TCP
  #   - name: grpc
  #     port: 9090
  #     targetPort: 9090
  #     protocol: TCP

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Argo Rollouts configuration (requires the argo-rollouts controller installed
# in the cluster: https://argo-rollouts.readthedocs.io/).
#
# When `rollout.enabled` is true:
#   - This chart renders a Rollout (argoproj.io/v1alpha1) instead of a
#     Deployment. The two are mutually exclusive: the Deployment is removed.
#   - The HPA (if `autoscaling.enabled` is true) is rewired to target the
#     Rollout via scaleTargetRef.
#   - The Service is split into a stable + canary pair when both
#     `rollout.enabled` and `rollout.canary.trafficRouting.enabled` are true;
#     otherwise the single Service is retained and the canary shifts weight
#     purely by ReplicaSet sizing.
#
# MIGRATION NOTE: switching an existing release from Deployment to Rollout
# leaves the old Deployment object in the cluster (Helm does not delete
# resources that are no longer rendered). After the first `helm upgrade`
# that enables rollout, manually remove the orphan:
#   kubectl delete deployment <fullname> -n <namespace>
rollout:
  enabled: false
  # Desired replica count for the Rollout. Falls back to `replicaCount` when
  # empty. Ignored when `autoscaling.enabled` is true (HPA owns the count).
  replicas: 1
  revisionHistoryLimit: 10
  canary:
    # MaxSurge / maxUnavailable passed verbatim to the Rollout's canary
    # strategy. Defaults match Kubernetes RollingUpdate (25% surge, 0 unavailable).
    maxSurge: "25%"
    maxUnavailable: 0
    # Ordered list of canary steps (setWeight / pause / experiment / analysis /
    # setCanaryScale / plugin). Rendered verbatim under `strategy.canary.steps`.
    # When `analysis.enabled` is true and `analysis.mode == "step"`, an analysis
    # step referencing each rendered AnalysisTemplate is prepended to this list.
    steps:
      - setWeight: 25
      - pause: { duration: 30s }
      - setWeight: 50
      - pause: { duration: 30s }
      - setWeight: 100
    # Traffic routing provider configuration. When `enabled` is true, the chart
    # renders a stable + canary Service pair and the Rollout drives traffic
    # splitting via the configured provider. When false, the Rollout shifts
    # canary weight purely by ReplicaSet sizing (single Service).
    #
    # Exactly ONE provider must be set when `enabled: true`. Setting 2+ will
    # fail `helm template` / `helm install` with a clear error.
    #
    # Built-in providers (see Argo Rollouts docs for the full shape):
    #   nginx | alb | smi | istio | traefik | ambassador | app-mesh | google | sfx
    #
    # Plugin providers:
    #   plugins."argoproj-labs/gatewayAPI"   (Gateway API — requires the
    #   external plugin installed in the argo-rollouts controller, see
    #   charts/go/README.md "Installing the Gateway API plugin")
    #
    # Examples:
    #
    # nginx ingress controller (built-in):
    # trafficRouting:
    #   enabled: true
    #   nginx:
    #     stableIngress: primary
    #
    # Gateway API plugin (Envoy Gateway / Istio / GKE / Kong / nginx Gateway
    # Fabric / Cilium / etc. — also requires httpRoute.enabled=true so the chart
    # renders the dual-backendRef HTTPRoute):
    # trafficRouting:
    #   enabled: true
    #   plugins:
    #     argoproj-labs/gatewayAPI:
    #       httpRoute: ""        # defaults to <fullname>
    #       namespace: ""        # defaults to the Rollout namespace
    trafficRouting:
      enabled: false
    # Optional overrides for the auto-provisioned stable/canary Service names.
    # Defaults: stable -> <fullname>, canary -> <fullname>-canary.
    stableService: ""
    canaryService: ""
  analysis:
    # Master toggle. When true, AnalysisTemplate CRDs are rendered from
    # `templates` and referenced by the Rollout. When false, no analysis runs
    # and the canary advances purely via `steps` (setWeight / pause).
    enabled: false
    # How analysis is wired into the Rollout:
    #   step       -> insert an `analysis` step before each `setWeight` block
    #   background -> run continuously across the whole rollout
    mode: step
    # Shared args passed to every AnalysisTemplate invocation. List of
    # {name, value | valueFrom} entries, passed through verbatim.
    args: []
    # AnalysisTemplate definitions rendered as CRDs. Each entry must specify a
    # unique `name` and a `metrics` list (Argo Rollouts metric spec). Optional
    # `args` are scoped to that single template.
    #
    # Example (Prometheus / VictoriaMetrics — the prometheus provider talks to
    # VictoriaMetrics directly via its PromQL-compatible /api/v1/query endpoint):
    # templates:
    #   - name: success-rate
    #     metrics:
    #       - name: success-rate
    #         interval: 1m
    #         successCondition: result[0] >= 0.95
    #         failureLimit: 2
    #         provider:
    #           prometheus:
    #             address: http://vmselect.monitoring:8481/select/0/prometheus
    #             query: |
    #               sum(rate(http_requests_total{status!~"5.."}[2m]))
    #               / sum(rate(http_requests_total[2m]))
    templates: []

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}
tolerations: []
affinity: {}

# Init containers that run before the main container
# For more info: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
initContainers: []
# - name: init-myservice
#   image: busybox:1.28
#   command: ['sh', '-c', 'until nslookup myservice; do echo waiting for myservice; sleep 2; done;']
# - name: init-db
#   image: busybox:1.28
#   command: ['sh', '-c', 'echo "Running database migrations"']

# ConfigMap configuration
# For more information checkout: https://kubernetes.io/docs/concepts/configuration/configmap/
configMap:
  # Enable or disable ConfigMap creation
  enabled: false
  # Files to include from files/ directory (relative to chart root)
  # files:
  #   - config/app.yaml
  #   - config/settings.json
  # Inline data (key-value pairs)
  # data:
  #   APP_CONFIG: |
  #     key: value
  #   settings.json: |
  #     {"debug": true}
  # Mount ConfigMap as volume at this path (optional)
  # mountPath: /etc/config
  # Mount specific file only (optional)
  # subPath: app.yaml
  # Inject all ConfigMap keys as environment variables
  envFrom: false
  # Automatically mount ConfigMap in all initContainers
  mountInInitContainers: false

# PersistentVolumeClaim configuration for the Deployment.
# When enabled, the chart renders one PVC and mounts it into the container
# at the configured path. Set existingClaim to skip creation and bind an
# externally-managed claim instead.
# For more info: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
persistence:
  enabled: false
  # Volume + mount name (also used to build the claim name: <fullname>-<name>)
  name: data
  # Container mount path.
  mountPath: /data
  # Optional subPath within the volume.
  subPath: ""
  # StorageClass to bind. Empty string uses the cluster default.
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  # Annotations applied to the rendered PersistentVolumeClaim.
  annotations: {}
  # Optional label selector to match specific PVs.
  selector: {}
  # Skip creating a PVC and use an existing claim by this name.
  existingClaim: ""

# ExternalSecret configuration (requires the external-secrets controller in the cluster)
# https://external-secrets.io/
externalSecret:
  # Enable ExternalSecret creation. When enabled, a Secret is synced from an
  # external store (AWS Secrets Manager, Vault, GCP SM, Azure KV, etc.).
  enabled: false
  # Override the synced Secret name. Defaults to the chart fullname.
  targetName: ""
  # Inject all synced Secret keys as environment variables on the Deployment.
  envFrom: false
  # Have this chart manage the SecretStore as well. When false, you must
  # reference an externally-managed store via secretStoreRef below.
  secretStore:
    create: false
    # SecretStore or ClusterSecretStore
    kind: SecretStore
    # Provider config (aws/azure/gcp/vault/etc.) passed through verbatim.
    # See https://external-secrets.io/latest/provider/aws-secrets-manager/
    # provider: {}
    #   aws:
    #     service: SecretsManager
    #     region: eu-west-1
    #     auth:
    #       jwt:
    #         serviceAccountRef:
    #           name: my-sa
  # Reference an externally-managed store (used when secretStore.create is false).
  secretStoreRef:
    name: ""
    kind: SecretStore
  # How often to re-sync the Secret from the external store.
  refreshInterval: 1h
  # Target Secret options.
  target:
    creationPolicy: Owner
    # Optional Secret template overrides (metadata, type, data keys, etc.)
    # template: {}
  # Per-key mappings from the external store to the synced Secret.
  data: []
  # - secretKey: API_KEY
  #   remoteRef:
  #     key: prod/app/api-key
  #     property: value
  # Pull all keys from a single external path into the synced Secret.
  dataFrom: []
  # - extract:
  #     key: prod/app/config

# Prometheus/VictoriaMetrics metrics scraping.
# Compatible with annotation-based scrape configs (e.g. the kubernetes-pods and
# kubernetes-service-endpoints jobs in vmagent / victoria-metrics). No
# prometheus-operator CRDs are required: discovery is driven by prometheus.io/*
# annotations injected onto the Pod and/or Service.
metrics:
  # Enable metrics exposition hints. When true, injects prometheus.io/*
  # annotations onto the Pod and/or Service (see podAnnotations /
  # serviceAnnotations toggles below).
  enabled: false
  # Container port where the metrics endpoint is served. MUST match the actual
  # containerPort: the scrape config applies `keep_if_equal` between this
  # annotation and __meta_kubernetes_pod_container_port_number, so a mismatch
  # causes the target to be silently dropped. Leave empty to auto-resolve from
  # service.port (or service.ports[0].targetPort / .port when service.ports is set).
  port: ""
  # HTTP path serving metrics.
  path: /metrics
  # Scheme to scrape with: http or https.
  scheme: http
  # Namespace where the scraper (vmagent / victoria-metrics / prometheus) runs.
  # Used by the ciliumNetworkPolicy `allowMonitoring` preset to whitelist ingress
  # from this namespace. Change if your scraper lives elsewhere.
  scrapeNamespace: monitoring
  # Inject prometheus.io/* annotations into the Pod template.
  # Discovered by scrape configs using `role: pod` (e.g. the kubernetes-pods job).
  podAnnotations:
    enabled: true
  # Inject prometheus.io/* annotations into the Service.
  # Discovered by scrape configs using `role: endpoints` (e.g. the
  # kubernetes-service-endpoints job). No effect when service.enabled is false.
  serviceAnnotations:
    enabled: true

# CiliumNetworkPolicy configuration (requires Cilium CNI installed in the cluster)
# https://docs.cilium.io/en/stable/network/kubernetes/policy/
ciliumNetworkPolicy:
  # Enable or disable CiliumNetworkPolicy creation
  enabled: false
  # Preset controls the generated rules to keep values terse:
  #   sameNamespace    -> ingress + egress only with endpoints in this namespace
  #   anotherNamespace -> ingress + egress with endpoints in this namespace AND
  #                       every namespace listed in `allowNamespaces`
  #   allowMonitoring  -> same as sameNamespace, PLUS allow ingress/egress from
  #                       the namespace named in `metrics.scrapeNamespace`
  #                       (default "monitoring") so vmagent/prometheus can scrape
  #   custom           -> use `endpointSelector`, `ingress`, `egress` verbatim
  preset: sameNamespace
  # Namespaces to allow when preset == "anotherNamespace".
  # Ignored for other presets.
  allowNamespaces: []
  # - kube-system
  # - monitoring
  # - gateway
  # Endpoint selector applied to the policy (defaults to all endpoints in the
  # namespace). Used for every preset.
  endpointSelector: {}
  # Custom Cilium ingress/egress rules. Used ONLY when preset == "custom".
  # Passed through to the CiliumNetworkPolicy spec verbatim.
  # See: https://docs.cilium.io/en/stable/network/kubernetes/policy/language/
  ingress: []
  egress: []

# Job configuration for running migrations or one-time tasks
# Uses Helm hooks to run before deployment (pre-install, pre-upgrade)
# For more info: https://kubernetes.io/docs/concepts/workloads/controllers/job/
job:
  enabled: false
  migrations: []
  # - name: migrate
  #   # Optional: use different image (defaults to app image)
  #   # image: "myapp:migrate"
  #   command:
  #     - /bin/sh
  #     - -c
  #     - "echo 'Running migration...'"
  #   # Optional args
  #   # args: ["--verbose"]
  #   # Optional environment variables
  #   # env:
  #   #   - name: DB_HOST
  #   #     value: "postgres"
  #   # Optional: additional volumeMounts specific to this job
  #   # volumeMounts: []
  #   # Helm hook settings (defaults shown)
  #   # hook: "pre-install,pre-upgrade"
  #   # hookWeight: 0  # Lower runs first
  #   # hookDeletePolicy: "before-hook-creation,hook-succeeded"
  #   # backoffLimit: 1

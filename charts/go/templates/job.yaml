{{- if .Values.job.enabled }}
{{- range .Values.job.migrations }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "go.fullname" $ }}-{{ .name }}
  labels:
    {{- include "go.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ .hook | default "pre-install,pre-upgrade" }}
    "helm.sh/hook-weight": "{{ .hookWeight | default 0 }}"
    "helm.sh/hook-delete-policy": {{ .hookDeletePolicy | default "before-hook-creation,hook-succeeded" }}
spec:
  backoffLimit: {{ .backoffLimit | default 1 }}
  template:
    metadata:
      labels:
        {{- include "go.selectorLabels" $ | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "go.serviceAccountName" $ }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .name }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .image | default (printf "%s:%s" $.Values.image.repository ($.Values.image.tag | default $.Chart.AppVersion)) }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with .command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and $.Values.configMap.enabled $.Values.configMap.envFrom }}
          envFrom:
            - configMapRef:
                name: {{ include "go.fullname" $ }}
          {{- end }}
          {{- if or $.Values.volumeMounts (and $.Values.configMap.enabled $.Values.configMap.mountPath) .volumeMounts }}
          volumeMounts:
            {{- with .volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $.Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if and $.Values.configMap.enabled $.Values.configMap.mountPath }}
            - name: config-volume
              mountPath: {{ $.Values.configMap.mountPath }}
              {{- if $.Values.configMap.subPath }}
              subPath: {{ $.Values.configMap.subPath }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or $.Values.volumes (and $.Values.configMap.enabled $.Values.configMap.mountPath) }}
      volumes:
        {{- with $.Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and $.Values.configMap.enabled $.Values.configMap.mountPath }}
        - name: config-volume
          configMap:
            name: {{ include "go.fullname" $ }}
        {{- end }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}

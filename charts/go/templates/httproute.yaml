{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "go.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $useGatewayAPIRollout := and .Values.rollout.enabled (dig "canary" "trafficRouting" "enabled" false .Values.rollout) (eq (include "go.canary.activeProvider" .) "gatewayapi") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "go.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        {{- if $useGatewayAPIRollout }}
        {{- /* Gateway API + Argo Rollouts: dual backendRefs so the Rollout
               controller can patch weights between stable and canary Services
               at runtime. Initial weights 100/0 are nominal — Argo overwrites
               them as the canary progresses. */}}
        - name: {{ include "go.canary.stableService" $ }}
          port: {{ $svcPort }}
          weight: 100
        - name: {{ include "go.canary.canaryService" $ }}
          port: {{ $svcPort }}
          weight: 0
        {{- else }}
        - name: {{ $fullName }}
          port: {{ $svcPort }}
          weight: 1
        {{- end }}
    {{- end }}
{{- end }}

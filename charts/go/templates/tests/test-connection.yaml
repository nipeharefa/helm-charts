{{- if .Values.service.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "go.fullname" . }}-test-connection"
  labels:
    {{- include "go.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      {{- if .Values.service.ports }}
      args: ['{{ include "go.fullname" . }}:{{ (index .Values.service.ports 0).port }}']
      {{- else }}
      args: ['{{ include "go.fullname" . }}:{{ .Values.service.port }}']
      {{- end }}
  restartPolicy: Never
{{- end }}
